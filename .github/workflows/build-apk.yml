name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android@7

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add camera permission
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          content = path.read_text()

          permission = '<uses-permission android:name="android.permission.CAMERA" />'

          if permission not in content:
              content = content.replace(
                  '<manifest ',
                  '<manifest ' + permission + '\n',
                  1
              )
              path.write_text(content)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btvtc-attendance-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
